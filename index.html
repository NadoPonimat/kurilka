<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Курилка — брось курить</title>
<style>
:root{--bg:#10151c;--card:#1a222d;--tx:#e8eef5;--ac:#ff8a3d;--mu:color-mix(in srgb,var(--tx) 55%,var(--bg));--ok:#3ecf8e;--bad:#ef5350;--ln:color-mix(in srgb,var(--tx) 14%,var(--card))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:76px}
header{padding:14px 16px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
main{max-width:560px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-radius:0;color:var(--mu);padding:8px 2px;font-size:18px;display:flex;flex-direction:column;align-items:center}
nav small{font-size:10px}nav .on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}p{margin:6px 0}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;cursor:pointer}
.big{width:100%;background:var(--ac);color:var(--bg);border:0;font-weight:700;margin-top:8px;padding:14px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
input[type=color]{padding:2px;height:40px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px;flex:1}
.row{display:flex;gap:8px}.mu{color:var(--mu);font-size:13px}
.cd{font-size:42px;font-weight:800;text-align:center;margin:6px 0}
.cd.ok,.ok-t{color:var(--ok)}.cd.bad{color:var(--bad);font-size:26px}
#sub{text-align:center;color:var(--mu);margin:0 0 8px}
.chip{display:inline-block;padding:4px 9px;border-radius:99px;border:1px solid var(--ln);margin:2px;font-size:13px}
.chip.done{background:var(--ok);color:#000;opacity:.6;text-decoration:line-through}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center}.stats b{display:block;font-size:22px;color:var(--ac)}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mu)}
.day{border-radius:8px;padding:4px 0;min-height:48px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.day small{font-size:10px;color:var(--mu)}
.day.ok{background:color-mix(in srgb,var(--ok) 28%,var(--card))}
.day.bad{background:color-mix(in srgb,var(--bad) 32%,var(--card))}
.day.sel{outline:2px solid var(--ac)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}.seg .on,.lv .on{border-color:var(--ac);color:var(--ac)}
.hr{display:flex;gap:2px;margin-bottom:2px;align-items:center}
.hr span{width:42px;font-size:11px;color:var(--mu);flex:none}
.hc{flex:1;height:28px;border-radius:3px;font-size:9px;display:grid;place-items:center;color:var(--tx);border:1px solid var(--ln)}
.hh .hc{border:0;height:auto;color:var(--mu)}
.lv{display:flex;gap:6px}.lv button{flex:1;padding:8px 0;font-size:22px;display:flex;flex-direction:column;align-items:center}.lv small{font-size:9px}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th button{padding:8px;font-size:13px;border-width:2px}
.th i{display:flex;height:18px;border-radius:4px;overflow:hidden;margin-bottom:5px}.th i b{flex:1}
.user{width:100%;text-align:left;margin-bottom:8px;font-size:18px;padding:16px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),L=localStorage;
let S;try{S=JSON.parse(L.kur)}catch(e){}
S=S||{users:[],cur:null,ct:[]};
let J='';
const save=()=>{L.kur=JSON.stringify(S);const u=S.g&&U();if(u){const j=JSON.stringify(toR(u));if(j!=J){J=j;push(u)}}};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>{m=Math.round(m)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const tm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const U=()=>S.users.find(u=>u.id==S.cur);
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const TH=[["Ночь","#10151c","#1a222d","#e8eef5","#ff8a3d"],["Уголь","#121212","#1e1e1e","#eeeeee","#bb86fc"],["Океан","#0b1d2e","#12304a","#e3f2fd","#29b6f6"],["Лес","#0f1f14","#17301f","#e6f4ea","#66bb6a"],["Закат","#2a1220","#3d1c2f","#ffe9ec","#ff7043"],["Сакура","#fff0f5","#ffffff","#4a2a36","#ec407a"],["Лаванда","#f3eefc","#ffffff","#2e2447","#7e57c2"],["Мята","#e8f7f1","#ffffff","#1f3a30","#1abc9c"],["Песок","#f6efe2","#fffaf0","#3b3226","#c98a3a"],["Бумага","#f5f5f5","#ffffff","#212121","#424242"],["Лёд","#eaf4fb","#ffffff","#17324a","#2196f3"],["Неон","#0a0a14","#14142b","#e0f7ff","#00ffc8"],["Ретро","#2b2118","#3d2e20","#f2e2c4","#e0a526"],["Кофе","#241a14","#35261d","#f0e2d6","#c27c4a"],["Космос","#0d0b24","#1a1640","#e8e4ff","#8c7bff"],["Бордо","#26090f","#3a1019","#fbe9ec","#e53950"],["Хаки","#1c2016","#2a3021","#e9edd9","#a5b84a"]].map(a=>({n:a[0],bg:a[1],card:a[2],tx:a[3],ac:a[4]}));
const allTh=()=>TH.concat(S.ct);
function theme(u){const t=allTh().find(x=>u&&x.n==u.th)||TH[0],r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--card',t.card);r.setProperty('--tx',t.tx);r.setProperty('--ac',t.ac)}
// Supabase
const SB='https://mstfaadlhwzrhxmeeqjv.supabase.co/rest/v1/',KEY='sb_publishable_XT8x1u3HSjM0W043uanGEQ_GeTQfLnC';
const api=(p,o={})=>fetch(SB+p,{...o,headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation',...o.headers}}).then(async r=>{if(!r.ok)throw new Error(await r.text());return r.status==204?null:r.json()});
const toU=r=>({id:r.id,name:r.name,pin:r.pin,...r.settings,log:r.log,feel:r.feel});
const toR=u=>({id:u.id,group_id:S.g.id,name:u.name,pin:u.pin||'',settings:{packs:u.packs,size:u.size,base:u.base,wake:u.wake,sleep:u.sleep,start:u.start,end:u.end,th:u.th},log:u.log,feel:u.feel});
const push=u=>api('kur_users?on_conflict=id',{method:'POST',headers:{Prefer:'return=minimal,resolution=merge-duplicates'},body:JSON.stringify(toR(u))}).catch(e=>{J='';alert('Не сохранилось на сервере: '+(/максимум/.test(e.message)?'в группе уже 6 человек':String(e.message).slice(0,300)))});
async function pull(){if(!S.g)return;try{const r=await api('kur_users?group_id=eq.'+S.g.id+'&order=created_at'),cu=U(),dirty=cu&&JSON.stringify(toR(cu))!=J;
S.users=r.map(toU);if(dirty){const i=S.users.findIndex(x=>x.id==cu.id);if(i>=0)S.users[i]=cu}else if(U())J=JSON.stringify(toR(U()));
L.kur=JSON.stringify(S)}catch(e){}}
function gsetup(){theme(null);$('#app').innerHTML=`<header><b>🚬➜🌿 Курилка</b></header><main><div class="card"><h3>Создать группу</h3><label>Название<input id="g_n" placeholder="Наши бросающие"></label><button class="big" onclick="gnew()">Создать</button></div><div class="card"><h3>Войти по коду</h3><label>Код группы<input id="g_c" maxlength="6" style="text-transform:uppercase"></label><button class="big" onclick="gjoin()">Войти</button></div></main>`}
async function gnew(){const n=$('#g_n').value.trim();if(!n)return alert('Введи название');const code=Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
try{const r=await api('kur_groups',{method:'POST',body:JSON.stringify({name:n,code})});S.g={id:r[0].id,code,name:n};S.users=[];S.cur=null;save();login(1)}catch(e){alert('Ошибка: '+e.message)}}
async function gjoin(c){c=(c||$('#g_c').value).trim().toUpperCase();try{const r=await api('kur_groups?code=eq.'+encodeURIComponent(c));if(!r.length){alert('Группа не найдена');return R()}S.g={id:r[0].id,code:c,name:r[0].name};S.cur=null;save();await pull();login()}catch(e){alert('Ошибка: '+e.message);R()}}
function gleave(){if(!confirm('Выйти из группы на этом устройстве? Данные в группе сохранятся.'))return;S.g=null;S.users=[];S.cur=null;save();R()}
// логика
const lim=(u,d)=>{if(d<u.start)return u.base;const t=Math.max(1,days(u.start,u.end)),i=days(u.start,d);return i>=t?0:Math.round(u.base*(1-i/t))};
const cnt=(u,d)=>u.log.filter(t=>ds(new Date(t))==d).length;
const slots=(u,n)=>{let w=tm(u.wake),s=tm(u.sleep);if(s<=w)s+=1440;const v=(s-w)/n;return Array.from({length:n},(_,i)=>w+v*(i+.5))};
function info(u){const now=new Date(),d=ds(now),n=lim(u,d),s=cnt(u,d);let at=null;if(s<n)at=new Date(pd(d).getTime()+slots(u,n)[s]*6e4);return{n,s,at,ok:at&&now>=at,now,d}}
const ST=[[.15,"😌 Лёгкое беспокойство: тянет «по привычке» — после еды, кофе, в паузах. Это нормально."],[.4,"😕 Тяга к ритуалам, раздражительность, хуже концентрация. Пей воду, меняй привычный маршрут."],[.7,"😣 Заметная ломка: тревога, перепады настроения, голод, плохой сон. Волна тяги длится 3–5 минут — переждай."],[.99,"😖 Пик: сильная тяга, раздражение. Двигайся, дыши глубоко, откладывай сигарету на 10 минут."],[2,"🌤 Лимит 0: тяга приходит волнами и слабеет с каждым днём. Ты справляешься!"]];
const EM=[["😌","спокойно"],["😐","терпимо"],["😣","тянет"],["😖","ломка"],["🤬","срыв"]];
const stage=u=>{const i=info(u);return ST.find(x=>1-i.n/u.base<=x[0])[1]};
// экраны
function R(){const u=U();if(!u){return login()}theme(u);const t=S.tab||'today';
$('#app').innerHTML=`<header><b>🚬➜🌿 ${esc(u.name)} · курилка</b></header><main>${V[t](u)}</main><nav>${[['today','Сегодня','⏱'],['cal','Календарь','📅'],['heat','Карты','🔥'],['feel','Ощущения','💭'],['grp','Группа','👥'],['set','Ещё','⚙️']].map(([k,n,i])=>`<button class="${k==t?'on':''}" onclick="S.tab='${k}';save();R();if(S.tab=='grp')pull().then(()=>S.tab=='grp'&&R())">${i}<small>${n}</small></button>`).join('')}</nav>`;tick()}
const V={
today:u=>{const d=ds(new Date()),i=info(u);let sv=0;for(let k=0;k<=days(u.start,d);k++)sv+=u.base-cnt(u,add(u.start,k));
return`<div class="card"><div class="mu" style="text-align:center">Сегодня выкурено ${i.s} из ${i.n}</div><div id="cd" class="cd"></div><p id="sub"></p>
<button class="big" onclick="smoke()">🚬 Я покурил(а)</button>
${cnt(u,d)?'<button style="width:100%;margin-top:8px" onclick="undo()">Отменить последнюю</button>':''}</div>
<div class="card"><h3>График на сегодня</h3>${i.n?slots(u,i.n).map((m,k)=>`<span class="chip ${k<i.s?'done':''}">${hm(m)}</span>`).join(''):'<p class="mu">Лимит 0 — сегодня не курим</p>'}</div>
<div class="card stats"><div><b>${Math.max(0,days(d,u.end))}</b><span class="mu">дн. до цели</span></div><div><b>${Math.max(0,sv)}</b><span class="mu">не выкурено</span></div><div><b>${u.base}</b><span class="mu">было в сутки</span></div></div>
<div class="card"><h3>Что сейчас ожидается</h3><p>${stage(u)}</p></div>`},
cal:u=>{const td=ds(new Date()),m=S.cm||td.slice(0,7),[Y,M]=m.split('-').map(Number),f=(new Date(Y,M-1,1).getDay()+6)%7,dim=new Date(Y,M,0).getDate();
let c=WD.map(w=>`<div class="h">${w}</div>`).join('')+'<i></i>'.repeat(f);
for(let k=1;k<=dim;k++){const d=m+'-'+pad(k),n=lim(u,d),s=cnt(u,d),past=d<=td&&d>=u.start;
c+=`<div class="day ${past?(s<=n?'ok':'bad'):''} ${d==S.sel?'sel':''}" onclick="S.sel='${d}';R()"><b>${k}</b><small>${past?s+'/'+n:(d>=u.start&&d<=u.end?'—/'+n:'')}</small></div>`}
const sd=S.sel||td;
return`<div class="card"><div class="nav2"><button onclick="cm(-1)">‹</button><b>${new Date(Y,M-1,1).toLocaleDateString('ru',{month:'long',year:'numeric'})}</b><button onclick="cm(1)">›</button></div><div class="cal">${c}</div><p class="mu">выкурено / лимит. Зелёный — в норме, красный — превышен</p></div>
<div class="card"><h3>${sd}</h3><p>Лимит: ${lim(u,sd)} · выкурено: ${cnt(u,sd)}</p><p class="mu">${u.log.filter(t=>ds(new Date(t))==sd).map(t=>hm(new Date(t).getHours()*60+new Date(t).getMinutes())).join(', ')||'—'}</p>
${u.feel.filter(f=>ds(new Date(f.t))==sd).map(f=>`<p>${EM[f.lv][0]} ${esc(f.note||EM[f.lv][1])}</p>`).join('')}</div>`},
heat:u=>{const md=S.hm||'d',d=S.sel||ds(new Date());let rows;
const hrs=dd=>{const a=Array(24).fill(0);u.log.forEach(t=>{const x=new Date(t);if(ds(x)==dd)a[x.getHours()]++});return a};
if(md=='d')rows=[[d.slice(5),hrs(d)]];
else if(md=='w'){const s=add(d,-((pd(d).getDay()+6)%7));rows=WD.map((w,i)=>[w+' '+add(s,i).slice(8),hrs(add(s,i))])}
else{const m=d.slice(0,7);rows=WD.map(w=>[w,Array(24).fill(0)]);u.log.forEach(t=>{const x=new Date(t);if(ds(x).slice(0,7)==m)rows[(x.getDay()+6)%7][1][x.getHours()]++})}
const mx=Math.max(1,...rows.flatMap(r=>r[1]));
const hd='<div class="hr hh"><span></span>'+Array.from({length:24},(_,h)=>`<div class="hc">${h%3==0?h:''}</div>`).join('')+'</div>';
return`<div class="card"><div class="seg">${[['d','День'],['w','Неделя'],['m','Месяц']].map(([k,n])=>`<button class="${k==md?'on':''}" onclick="S.hm='${k}';R()">${n}</button>`).join('')}</div>
<div class="nav2"><button onclick="hs(-1)">‹</button><b>${md=='m'?d.slice(0,7):d}</b><button onclick="hs(1)">›</button></div>${hd}
${rows.map(r=>`<div class="hr"><span>${r[0]}</span>${r[1].map(v=>`<div class="hc" style="background:${v?`color-mix(in srgb,var(--ac) ${15+v/mx*85}%,var(--card))`:'var(--card)'}">${v||''}</div>`).join('')}</div>`).join('')}
<p class="mu">Часы по горизонтали. ${md=='m'?'Месяц: сумма по дням недели.':'Чем ярче — тем больше сигарет в этот час.'}</p></div>`},
feel:u=>`<div class="card"><h3>Что сейчас ожидается</h3><p>${stage(u)}</p><p class="mu">Если ломка сильнее ожидаемой — продли срок в разделе «Ещё».</p></div>
<div class="card"><h3>Как ты себя чувствуешь?</h3><div class="lv">${EM.map((e,i)=>`<button onclick="pick(${i})">${e[0]}<small>${e[1]}</small></button>`).join('')}</div><input id="fn" placeholder="Заметка (необязательно)"><button class="big" onclick="addF()">Сохранить</button></div>
<div class="card"><h3>История</h3>${u.feel.slice(-12).reverse().map(f=>{const x=new Date(f.t);return`<p>${EM[f.lv][0]} <span class="mu">${ds(x).slice(5)} ${hm(x.getHours()*60+x.getMinutes())}</span> ${esc(f.note||EM[f.lv][1])}</p>`}).join('')||'<p class="mu">Пока пусто</p>'}</div>`,
grp:u=>{const td=ds(new Date());return`<div class="card"><h3>👥 ${esc(S.g.name)}</h3><p class="mu">Код группы: <b>${S.g.code}</b></p><button class="big" onclick="inv()">🔗 Пригласить по ссылке</button></div>`+S.users.map(x=>{const n=lim(x,td),s=cnt(x,td),tot=Math.max(1,days(x.start,x.end)),p=Math.min(100,Math.max(0,Math.round(days(x.start,td)/tot*100))),la=x.log.length?new Date(x.log[x.log.length-1]):null;
return`<div class="card"><b>${esc(x.name)}</b> ${x.id==u.id?'<span class="mu">(ты)</span>':''}<p>Сегодня: <b style="color:var(--${s<=n?'ok':'bad'})">${s}/${n}</b> · ${la?'последняя в '+hm(la.getHours()*60+la.getMinutes())+(ds(la)==td?'':' ('+ds(la).slice(5)+')'):'ещё не курил(а)'}</p><div style="height:8px;border-radius:4px;background:var(--bg)"><div style="height:8px;border-radius:4px;width:${p}%;background:var(--ac)"></div></div><p class="mu">Путь к цели: ${p}% · осталось ${Math.max(0,days(td,x.end))} дн.</p></div>`}).join('')+`<button onclick="gleave()">Выйти из группы</button>`},
set:u=>F(u,0)+`<div class="card"><h3>Тема оформления</h3><div class="th">${allTh().map(t=>`<button style="${t.n==u.th?'border-color:var(--ac)':''}" onclick="setTh('${esc(t.n)}')"><i><b style="background:${t.bg}"></b><b style="background:${t.card}"></b><b style="background:${t.tx}"></b><b style="background:${t.ac}"></b></i>${esc(t.n)}</button>`).join('')}</div></div>
<div class="card"><h3>Своя тема</h3><label>Название<input id="c_n" value="Моя"></label><div class="row"><label>Фон<input type="color" id="c_b" value="#101820"></label><label>Карточки<input type="color" id="c_c" value="#1b2735"></label><label>Текст<input type="color" id="c_t" value="#f0f0f0"></label><label>Акцент<input type="color" id="c_a" value="#ff5ca8"></label></div><button class="big" onclick="addCt()">Сохранить тему</button>
${S.ct.map((t,i)=>`<p>${esc(t.n)} <button onclick="delCt(${i})">✕</button></p>`).join('')}</div>
<div class="card"><h3>Пригласить друга</h3><p class="mu">Друг откроет ссылку, попадёт в вашу группу и выберет своё имя или создаст новую курилку.</p><button class="big" onclick="inv()">🔗 Поделиться ссылкой</button></div>
<div class="card"><h3>Данные</h3><button onclick="exp()">⬇ Экспорт</button> <label style="display:inline-block;margin-top:8px">Импорт<input type="file" accept=".json" onchange="imp(event)"></label>
<p><button onclick="S.cur=null;save();R()">Выйти из курилки</button> <button onclick="delU()" style="color:var(--bad)">Удалить курилку</button></p></div>`};
const F=(u,nw)=>`<div class="card"><h3>${nw?'Новая курилка':'Параметры'}</h3>
<label>Имя<input id="f_n" value="${esc(u.name)}"></label><label>PIN (необязательно)<input id="f_p" inputmode="numeric" maxlength="6" value="${esc(u.pin||'')}"></label>
<div class="row"><label>Пачек в сутки<input id="f_k" type="number" step="0.5" min="0.5" value="${u.packs}"></label><label>Сигарет в пачке<input id="f_z" type="number" min="1" value="${u.size}"></label></div>
<div class="row"><label>Просыпаюсь<input id="f_w" type="time" value="${u.wake}"></label><label>Засыпаю<input id="f_s" type="time" value="${u.sleep}"></label></div>
<div class="row"><label>Начало<input id="f_a" type="date" value="${u.start}"></label><label>Бросить к<input id="f_e" type="date" value="${u.end}"></label></div>
<button class="big" onclick="sv(${nw})">${nw?'Создать':'Сохранить'}</button>${nw&&S.users.length?'<button style="width:100%;margin-top:8px" onclick="login()">Назад</button>':''}</div>`;
function login(newF,pre){if(!S.g)return gsetup();theme(null);const t=ds(new Date());
const nu={id:Date.now(),name:'',pin:'',packs:2,size:20,wake:'07:00',sleep:'23:00',start:t,end:add(t,30)};
if(pre)Object.assign(nu,{packs:pre.packs,size:pre.size,wake:pre.wake,sleep:pre.sleep,end:add(t,pre.dur||30)});
$('#app').innerHTML=`<header><b>🚬➜🌿 Курилка</b></header><main><div class="card"><b>👥 ${esc(S.g.name)}</b> <span class="mu">код ${S.g.code}</span></div>${newF||!S.users.length?F(nu,1):`<div class="card"><h3>Кто куришь… то есть бросаешь?</h3>${S.users.map(u=>`<button class="user" onclick="enter(${u.id})">🚬 ${esc(u.name)}${u.pin?' 🔒':''}</button>`).join('')}${S.users.length<6?'<button class="big" onclick="login(1)">+ Новая курилка</button>':'<p class="mu">Максимум 6 курилок</p>'}</div>`}</main>`}
function enter(id){const u=S.users.find(x=>x.id==id);if(u.pin&&prompt('PIN')!==u.pin)return alert('Неверный PIN');S.cur=id;J=JSON.stringify(toR(u));S.tab='today';S.sel=null;save();R()}
function sv(nw){const g=i=>$('#'+i).value,t=ds(new Date());const o={name:g('f_n').trim(),pin:g('f_p').trim(),packs:+g('f_k'),size:+g('f_z'),wake:g('f_w'),sleep:g('f_s'),start:g('f_a'),end:g('f_e')};
if(!o.name||!(o.packs>0)||!(o.size>0)||!o.wake||!o.sleep||!o.start||!o.end)return alert('Заполни все поля');
if(o.wake==o.sleep)return alert('Время подъёма и сна не должно совпадать');if(o.end<=o.start)return alert('Дата цели должна быть позже начала');
o.base=Math.round(o.packs*o.size);
if(nw){if(S.users.length>=6)return alert('Максимум 6');const u={id:crypto.randomUUID(),log:[],feel:[],th:'Ночь',...o};S.users.push(u);S.cur=u.id;S.tab='today'}else Object.assign(U(),o);
save();R()}
function tick(){const u=U(),el=$('#cd');if(!u||!el)return;const i=info(u);let h,c='',b;
if(i.n==0){h='Лимит 0 🎉';b='Сегодня не курим'}
else if(!i.at){const nn=lim(u,add(i.d,1));h='Лимит на сегодня исчерпан';c='bad';b=nn?'Следующая завтра в '+hm(slots(u,nn)[0]):'Завтра лимит 0'}
else if(i.ok){h='Можно курить';c='ok';b='Отметь, когда покуришь'}
else{const s=Math.ceil((i.at-i.now)/1000);h=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);b='до следующей сигареты (в '+hm(i.at.getHours()*60+i.at.getMinutes())+')'}
el.textContent=h;el.className='cd '+c;$('#sub').textContent=b}
setInterval(tick,1000);
function smoke(){const u=U(),i=info(u);if(!i.ok&&!confirm(i.n==0||i.s>=i.n?'Лимит исчерпан. Всё равно отметить?':'Ещё рано по графику. Всё равно отметить?'))return;u.log.push(Date.now());save();R()}
function undo(){const u=U(),d=ds(new Date());for(let i=u.log.length-1;i>=0;i--)if(ds(new Date(u.log[i]))==d){u.log.splice(i,1);break}save();R()}
function cm(k){const m=S.cm||ds(new Date()).slice(0,7),[Y,M]=m.split('-').map(Number);S.cm=ds(new Date(Y,M-1+k,1)).slice(0,7);R()}
function hs(k){const md=S.hm||'d',d=S.sel||ds(new Date());if(md=='m'){const x=pd(d);x.setMonth(x.getMonth()+k,1);S.sel=ds(x)}else S.sel=add(d,md=='w'?7*k:k);R()}
function pick(i){S.lv=i;document.querySelectorAll('.lv button').forEach((b,k)=>b.classList.toggle('on',k==i))}
function addF(){if(S.lv==null)return alert('Выбери ощущение');U().feel.push({t:Date.now(),lv:S.lv,note:$('#fn').value.trim()});S.lv=null;save();R()}
function setTh(n){U().th=n;save();R()}
function addCt(){const g=i=>$('#'+i).value;const n=g('c_n').trim()||'Моя';if(allTh().some(t=>t.n==n))return alert('Такое название уже есть');S.ct.push({n,bg:g('c_b'),card:g('c_c'),tx:g('c_t'),ac:g('c_a')});U().th=n;save();R()}
function delCt(i){const n=S.ct[i].n;S.ct.splice(i,1);S.users.forEach(u=>{if(u.th==n)u.th='Ночь'});save();R()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kurilka-backup.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.users))throw 0;S=d;S.ct=S.ct||[];save();R()}catch(x){alert('Неверный файл')}};r.readAsText(f)}
function inv(){
const url=location.href.split('#')[0]+'#g='+S.g.code,txt='Присоединяйся к нашей курилке — бросаем курить вместе. Выбери своё имя или создай новую курилку:';
if(navigator.share)navigator.share({title:'Курилка',text:txt,url}).catch(()=>{});
else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert('Ссылка скопирована'),()=>prompt('Скопируй ссылку',url));
else prompt('Скопируй ссылку',url)}
function delU(){if(!confirm('Удалить курилку и все данные?'))return;api('kur_users?id=eq.'+S.cur,{method:'DELETE'}).catch(()=>{});S.users=S.users.filter(u=>u.id!=S.cur);S.cur=null;save();R()}
(async()=>{if(!S.g)S.users=[];
try{const m=location.hash.match(/^#g=([A-Za-z0-9]+)/);
if(m){history.replaceState(null,'',location.pathname+location.search);if(!S.g||S.g.code!=m[1].toUpperCase()){await gjoin(m[1]);return}}
if(S.g)await pull()}catch(e){}
R()})();
setInterval(()=>{if(S.g)pull().then(()=>{if(U()&&S.tab=='grp')R()})},30000);
</script></body></html>
